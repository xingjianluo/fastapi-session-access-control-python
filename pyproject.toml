[project]
name = "fastapi-session-access-control-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -s"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(levelname)s] %(name)s: %(message)s"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
